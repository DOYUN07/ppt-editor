<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPT 편집기</title>
<style>
  :root { --bg: #EEF0F4; --panel: #FFFFFF; --line: #E2E5EB; --text: #1B2130; --muted: #6B7280; --acc: #301E72; --acc-ink: #FFFFFF; --sel: #2F6BFF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font: 13px/1.45 "Pretendard", "Malgun Gothic", system-ui, sans-serif; display: flex; flex-direction: column; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 11px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
  .btn:hover { background: #F2F3F7; }
  .btn.primary { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.12); }
  .btn.sm { padding: 3px 8px; font-size: 12px; }
  .btn.ic { padding: 4px 7px; min-width: 30px; justify-content: center; }
  .btn.on { background: #E8EEFF; border-color: #9DB4FF; }
  .btn:disabled { opacity: .45; cursor: default; }
  input[type=text], input[type=number], select, textarea { border: 1px solid var(--line); border-radius: 7px; padding: 5px 7px; background: #fff; }
  input[type=text], select, textarea { width: 100%; }
  input[type=number] { width: 64px; }
  textarea { resize: vertical; min-height: 54px; }
  label.f { display: block; font-size: 11.5px; color: var(--muted); margin: 10px 0 4px; }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .warn { font-size: 11.5px; color: #92400E; background: #FEF3C7; border-radius: 6px; padding: 4px 8px; margin-top: 4px; }
  .grow { flex: 1; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  h3.sec { font-size: 12.5px; margin: 16px 0 6px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }

  /* top bar */
  header.top { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; z-index: 3; }
  header.top .logo { font-weight: 700; font-size: 14px; margin-right: 6px; white-space: nowrap; }
  .sep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; }
  .menu { position: relative; display: inline-block; }
  .menu .pop { position: absolute; right: 0; top: calc(100% + 4px); background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(20,24,40,.15); padding: 6px; min-width: 200px; display: none; z-index: 20; }
  .menu.open .pop { display: block; }
  .pop .mi { display: flex; gap: 8px; align-items: center; padding: 7px 9px; border-radius: 7px; cursor: pointer; }
  .pop .mi:hover { background: #F2F3F7; }

  /* context toolbar */
  .ctxbar { display: flex; align-items: center; gap: 5px; padding: 6px 12px; background: #FAFBFC; border-bottom: 1px solid var(--line); min-height: 44px; flex-wrap: wrap; z-index: 2; }
  .ctxbar .lbl { font-size: 11.5px; color: var(--muted); margin-right: 2px; }
  .ctxbar select { width: auto; max-width: 150px; padding: 4px 6px; }
  .ctxbar input[type=number] { width: 54px; padding: 4px 6px; }
  .swatch-btn { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; padding: 0; position: relative; }
  .swatch-btn.none { background: repeating-linear-gradient(45deg, #fff 0 4px, #F1F2F5 4px 8px); }
  .cpop { position: absolute; z-index: 30; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px; box-shadow: 0 10px 30px rgba(20,24,40,.18); width: 236px; }
  .cpop .sws { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin: 6px 0; }
  .cpop .sw { width: 22px; height: 22px; border-radius: 5px; border: 1px solid rgba(0,0,0,.1); cursor: pointer; }
  .cpop .sw.sel { outline: 2px solid var(--sel); outline-offset: 1px; }

  main { flex: 1; display: grid; grid-template-columns: 64px 290px 1fr 300px; min-height: 0; }
  main.drawer-closed { grid-template-columns: 64px 0 1fr 300px; }
  nav.rail { background: #1F2433; display: flex; flex-direction: column; align-items: stretch; padding-top: 6px; }
  nav.rail button { background: none; border: none; color: #C9CEDA; padding: 10px 2px; cursor: pointer; font-size: 10.5px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  nav.rail button svg { width: 20px; height: 20px; }
  nav.rail button.on, nav.rail button:hover { color: #fff; background: rgba(255,255,255,.08); }
  aside.drawer { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 4px 14px 24px; }
  main.drawer-closed aside.drawer { display: none; }
  aside.props { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 4px 14px 24px; }
  .tabs { display: flex; gap: 4px; margin: 8px 0; }
  .tabs button { flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 5px 4px; cursor: pointer; font-size: 12px; }
  .tabs button.on { background: var(--acc); color: #fff; border-color: var(--acc); }

  /* canvas */
  .center { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .canvas-wrap { flex: 1; overflow: auto; position: relative; min-height: 0; }
  .canvas-pad { min-width: 100%; min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 30px; box-sizing: border-box; }
  .canvas { position: relative; flex: 0 0 auto; box-shadow: 0 8px 28px rgba(20,24,40,.16); background: #fff; }
  .canvas.drop { outline: 3px dashed var(--sel); outline-offset: 6px; }
  .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; width: 960px; height: 540px; }
  .overlay { position: absolute; left: 0; top: 0; width: 960px; height: 540px; pointer-events: none; }
  .slide { position: relative; overflow: hidden; }
  .stage .slide { position: absolute; left: 0; top: 0; }
  .slide .el { position: absolute; transform-origin: 50% 50%; }
  .slide .el .fill, .slide .el .shp { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .slide .el .shp { overflow: visible; }
  .slide .tx { width: 100%; height: 100%; display: flex; flex-direction: column; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
  .slide .tx .p { position: relative; min-height: 1em; }
  .slide .tx .bul { position: absolute; top: 0; }
  .slide .tbl { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed; }
  .slide .tbl td { padding: 0 12px; overflow: hidden; }
  .slide .ph { display: flex; align-items: center; justify-content: center; background: #EEF0F4; color: #9AA1AE; font-size: 14px; }
  .stage .el { cursor: move; }
  .stage .el.locked { cursor: default; }
  .sel-box { position: absolute; border: 1.5px solid var(--sel); pointer-events: none; transform-origin: 50% 50%; }
  .sel-box.multi { border-style: dashed; }
  .hdl { position: absolute; background: #fff; border: 1.5px solid var(--sel); border-radius: 2px; pointer-events: auto; }
  .hdl.rot { border-radius: 50%; cursor: grab; }
  .guide { position: absolute; background: #FF3D8B; pointer-events: none; }
  .marquee { position: absolute; border: 1px dashed var(--sel); background: rgba(47,107,255,.08); pointer-events: none; }
  .hover-box { position: absolute; border: 1px solid rgba(47,107,255,.55); pointer-events: none; }
  .editing { position: absolute; outline: 2px solid var(--sel); background: transparent; cursor: text; z-index: 5; }
  .editing:focus { outline: 2px solid var(--sel); }
  .zoombar { position: absolute; right: 14px; bottom: 10px; display: flex; gap: 4px; background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 3px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }

  /* bottom strip */
  footer.strip { display: flex; gap: 10px; padding: 8px 12px 10px; overflow-x: auto; border-top: 1px solid var(--line); background: #E4E7ED; align-items: flex-start; min-height: 112px; }
  .thumb { flex: 0 0 auto; width: 150px; cursor: pointer; position: relative; }
  .thumb .fr { width: 150px; height: 84.4px; position: relative; overflow: hidden; border-radius: 4px; outline: 2px solid transparent; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .thumb .fr .slide { transform-origin: 0 0; position: absolute; left: 0; top: 0; }
  .thumb.sel .fr { outline-color: var(--sel); }
  .thumb.hidden .fr { opacity: .4; }
  .thumb .cap { font-size: 11px; color: var(--muted); margin-top: 3px; display: flex; justify-content: space-between; }
  .thumb.dragover::before { content: ''; position: absolute; left: -7px; top: 0; bottom: 18px; width: 3px; background: var(--sel); border-radius: 2px; }
  .add-slide { flex: 0 0 auto; width: 84px; height: 84px; border: 2px dashed #B7BDC9; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #6B7280; cursor: pointer; background: transparent; font-size: 12px; }

  /* drawer content */
  .tile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .tpl { cursor: pointer; }
  .tpl .fr { width: 100%; aspect-ratio: 16/9; position: relative; overflow: hidden; border-radius: 5px; border: 1px solid var(--line); background: #fff; }
  .tpl .fr .slide { transform-origin: 0 0; position: absolute; left: 0; top: 0; }
  .tpl:hover .fr { outline: 2px solid var(--sel); }
  .tpl .cap { font-size: 11.5px; text-align: center; margin-top: 3px; color: var(--muted); }
  .shape-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .shape-grid button { border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 6px; cursor: pointer; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
  .shape-grid button:hover { border-color: var(--sel); background: #F5F8FF; }
  .shape-grid svg { width: 100%; height: 100%; }
  .icon-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  .icon-grid button { border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 5px; cursor: pointer; aspect-ratio: 1; }
  .icon-grid button:hover { border-color: var(--sel); }
  .icon-grid svg { width: 100%; height: 100%; }
  .text-preset { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 9px 12px; margin-bottom: 6px; cursor: pointer; }
  .text-preset:hover { border-color: var(--sel); }
  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .gallery img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; cursor: pointer; border: 1px solid var(--line); }
  .gallery img:hover { outline: 2px solid var(--sel); }
  .colors { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cpick { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .cpick input[type=color] { width: 30px; height: 26px; border: none; padding: 0; background: none; cursor: pointer; }
  .cpick .lbl { font-size: 11.5px; color: var(--muted); }
  .cpick .hex { font-size: 12px; font-family: Consolas, monospace; }
  .swatches { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
  .swatches .sw { width: 24px; height: 24px; border-radius: 6px; border: 1px solid rgba(0,0,0,.08); }
  .notes div { padding: 4px 8px; border-radius: 6px; margin-top: 4px; background: #FEF3C7; color: #78350F; font-size: 12px; }
  .notes div.ok { background: #D1FAE5; color: #065F46; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; border: none; background: #fff; padding: 5px 2px; cursor: pointer; font-size: 11.5px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--acc); color: #fff; }
  .logo-prev { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
  .logo-prev div { height: 50px; border-radius: 8px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); font-size: 11px; color: var(--muted); }
  .logo-prev img { max-width: 80%; max-height: 26px; }
  details.more summary { cursor: pointer; font-size: 12px; color: var(--muted); margin-top: 12px; }
  .data-grid { width: 100%; border-collapse: collapse; }
  .data-grid td { padding: 1px; }
  .data-grid input { width: 100%; padding: 3px 5px; font-size: 12px; border-radius: 4px; }
  .img-field { border: 1px dashed var(--line); border-radius: 8px; padding: 8px; display: flex; gap: 8px; align-items: center; }
  .img-field img { width: 72px; height: 48px; object-fit: cover; border-radius: 4px; background: #F2F3F7; }

  /* modal / toast */
  .modal-back { position: fixed; inset: 0; background: rgba(15,18,30,.45); display: none; align-items: center; justify-content: center; z-index: 40; }
  .modal-back.show { display: flex; }
  .modal { background: #fff; border-radius: 12px; width: min(920px, 94vw); max-height: 90vh; overflow: auto; padding: 20px 22px; }
  .modal h3 { margin: 0 0 10px; font-size: 16px; }
  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin: 12px 0; }
  .results img { width: 100%; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .spinner { width: 28px; height: 28px; border: 3px solid #E5E7EB; border-top-color: var(--acc); border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  pre.log { background: #F6F7F9; padding: 10px; border-radius: 8px; font-size: 11px; white-space: pre-wrap; max-height: 200px; overflow: auto; }
  .toast { position: fixed; bottom: 128px; left: 50%; transform: translateX(-50%); background: #1F2433; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 12.5px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; }
  .choice { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
  .choice button { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 14px; cursor: pointer; }
  .choice button:hover { border-color: var(--acc); }
  .choice b { display: block; font-size: 14px; margin-bottom: 4px; }

  /* original-deck editor (import, keep design) */
  .orig { position: fixed; inset: 0; background: var(--bg); z-index: 30; display: flex; flex-direction: column; }
  .orig[hidden] { display: none; }
  .orig-head { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .orig-body { flex: 1; display: grid; grid-template-columns: 190px 1fr 360px; min-height: 0; }
  .orig-list { overflow: auto; padding: 10px; background: #E4E7ED; border-right: 1px solid var(--line); }
  .orig-list .it { position: relative; margin-bottom: 10px; cursor: pointer; }
  .orig-list img { width: 100%; display: block; border-radius: 3px; outline: 2px solid transparent; background: #fff; }
  .orig-list .it.sel img { outline-color: var(--sel); }
  .orig-list .it.del img { opacity: .3; }
  .orig-list .tag { position: absolute; top: 4px; left: 4px; background: rgba(20,24,40,.75); color: #fff; font-size: 10.5px; border-radius: 4px; padding: 1px 5px; }
  .orig-list .tag.mod { left: auto; right: 4px; background: #B45309; }
  .orig-stage { display: flex; align-items: center; justify-content: center; padding: 20px; min-width: 0; min-height: 0; }
  .orig-canvas { position: relative; box-shadow: 0 6px 24px rgba(20,24,40,.14); background: #fff; }
  .orig-canvas img { display: block; width: 100%; height: 100%; }
  .orig-canvas .hit { position: absolute; border: 1.5px dashed transparent; cursor: pointer; }
  .orig-canvas .hit:hover { border-color: rgba(47,107,255,.5); background: rgba(47,107,255,.05); }
  .orig-canvas .hit.on { border: 2px solid var(--sel); background: rgba(47,107,255,.08); }
  .orig-canvas .hit.mod::after { content: '수정됨'; position: absolute; top: -18px; left: 0; font-size: 10px; background: #B45309; color: #fff; padding: 1px 4px; border-radius: 3px; }
  .orig-form { overflow: auto; padding: 4px 16px 24px; background: var(--panel); border-left: 1px solid var(--line); }
  .orig-form .field { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-top: 8px; }
  .orig-form .field.on { border-color: var(--sel); box-shadow: 0 0 0 2px rgba(47,107,255,.12); }
  .orig-form .field .lbl { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; gap: 6px; }
  .orig-form table { border-collapse: collapse; width: 100%; }
  .orig-form td input { padding: 3px 4px; font-size: 12px; }

  /* slideshow */
  .show { position: fixed; inset: 0; background: #000; z-index: 60; display: flex; align-items: center; justify-content: center; cursor: none; }
  .show[hidden] { display: none; }
  .show .host { position: relative; }
  .show .host .slide { transform-origin: 0 0; position: absolute; left: 0; top: 0; }
  .show .count { position: fixed; right: 16px; bottom: 12px; color: rgba(255,255,255,.5); font-size: 12px; }
  .show .fadein { animation: fadeIn .5s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .a-fade { animation: fadeIn .5s ease both; }
  .a-fly { animation: flyIn .55s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes flyIn { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; } }
  .a-zoom { animation: zoomIn .5s ease both; }
  @keyframes zoomIn { from { opacity: 0; transform: scale(.4); } to { opacity: 1; } }
  .a-wipe { animation: wipeIn .6s ease both; }
  @keyframes wipeIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  .a-float { animation: floatIn .7s ease both; }
  @keyframes floatIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; } }
  .a-appear { animation: none; }
  .a-spin { animation: spinIn .8s ease both; }
  @keyframes spinIn { from { transform: rotate(-180deg) scale(.6); opacity: 0; } to { opacity: 1; } }
  .a-bounce { animation: bounceIn .8s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes bounceIn { from { opacity: 0; transform: translateY(-80px); } to { opacity: 1; } }
</style>
</head>
<body>
<header class="top">
  <span class="logo">PPT 편집기</span>
  <input type="text" id="fileName" style="width:200px" title="파일 이름">
  <span class="sep"></span>
  <button class="btn ic" id="undoBtn" title="실행 취소 (Ctrl+Z)">↶</button>
  <button class="btn ic" id="redoBtn" title="다시 실행 (Ctrl+Y)">↷</button>
  <span class="sep"></span>
  <button class="btn" id="importBtn" title="기존 PowerPoint 파일 가져오기">PPT 가져오기</button>
  <input type="file" id="pptFile" accept=".pptx,.ppt,.pptm,.potx" hidden>
  <span class="grow"></span>
  <select id="projectSel" style="width:160px" title="저장된 프로젝트"></select>
  <button class="btn" id="loadProject">열기</button>
  <button class="btn" id="saveProject">저장</button>
  <button class="btn" id="newDeck">새로 만들기</button>
  <span class="sep"></span>
  <button class="btn" id="presentBtn" title="발표 미리보기 (F5)">▶ 발표</button>
  <div class="menu" id="buildMenu">
    <div class="row" style="gap:0">
      <button class="btn primary" id="buildBtn" style="border-radius:8px 0 0 8px">PPT 만들기</button>
      <button class="btn primary" id="buildMore" style="border-radius:0 8px 8px 0;border-left:1px solid rgba(255,255,255,.3);padding:6px 8px">▾</button>
    </div>
    <div class="pop">
      <label class="mi"><input type="checkbox" id="optPdf"> PDF도 함께 저장</label>
      <label class="mi"><input type="checkbox" id="optPotx"> 서식 파일(.potx)도 저장</label>
    </div>
  </div>
</header>
<div class="ctxbar" id="ctxbar"></div>
<main id="main">
  <nav class="rail" id="rail"></nav>
  <aside class="drawer" id="drawer"></aside>
  <section class="center">
    <div class="canvas-wrap" id="canvasWrap">
      <div class="canvas-pad" id="canvasPad"><div class="canvas" id="canvas"><div class="stage" id="stage"></div><div class="overlay stage" id="overlay"></div></div></div>
    </div>
  </section>
  <aside class="props" id="props"></aside>
</main>
<footer class="strip" id="strip"></footer>
<div class="zoombar" id="zoombar" style="position:fixed;right:316px;bottom:132px;z-index:4">
  <button class="btn ic sm" id="zoomOut">－</button><button class="btn sm" id="zoomFit" style="min-width:58px">맞춤</button><button class="btn ic sm" id="zoomIn">＋</button>
</div>

<input type="file" id="imgFile" accept=".png,.jpg,.jpeg,.gif,.bmp,.webp" hidden>
<input type="file" id="logoFile" accept=".png,.svg,.jpg,.jpeg,.gif,.bmp" hidden>

<div class="orig" id="orig" hidden>
  <div class="orig-head">
    <b id="origName"></b><span class="hint" id="origInfo"></span><span class="grow"></span>
    <label class="row" style="gap:4px;font-size:12px" title="원본의 테마 색·글꼴을 고른 색 조합으로 바꿔요."><input type="checkbox" id="origBrand"> 내 색 조합 적용</label>
    <input type="text" id="origFile" style="width:220px">
    <button class="btn" id="origToFree">자유 편집으로 가져오기</button>
    <button class="btn" id="origToNew">새 양식으로 다시 만들기</button>
    <button class="btn primary" id="origSave">수정본 저장</button>
    <button class="btn" id="origClose">닫기</button>
  </div>
